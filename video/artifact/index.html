<title>Honorarios demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --ground:#141412; --surface:#1C1B18; --ink:#F1EEE7; --ink2:#C9C4BA; --ink3:#A39E94; --rule:rgba(236,233,226,.14); --accent:#E8633A; color-scheme: dark; }
  body { background:var(--ground); color:var(--ink); font:400 16px/1.5 "Archivo", system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding-inline:16px; padding-block:28px 48px; display:grid; gap:20px; }
  header { display:flex; align-items:center; gap:12px; font-weight:600; font-size:20px; letter-spacing:-.02em; }
  header svg { flex:none; }
  video { width:100%; max-width:100%; aspect-ratio:16/9; background:#000; border:1px solid var(--rule); border-radius:2px; display:block; }
  .meta { display:flex; flex-wrap:wrap; gap:8px 20px; font:500 12px/1.4 "IBM Plex Mono", ui-monospace, monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); }
  .meta b { color:var(--ink2); font-weight:500; }
  p { color:var(--ink2); max-width:62ch; margin:0; text-wrap:pretty; }
  a { color:var(--ink); text-underline-offset:3px; }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .tag { color:var(--accent); }
</style>
<main>
  <header>
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><g transform="rotate(-90 12 12)" fill="none" stroke-width="4"><circle cx="12" cy="12" r="8.5" pathLength="100" stroke="#F1EEE7" stroke-dasharray="90 10" stroke-dashoffset="-9"/><circle cx="12" cy="12" r="8.5" pathLength="100" stroke="#E8633A" stroke-dasharray="6 94" stroke-dashoffset="-1"/></g></svg>
    Honorarios
  </header>
  <video id="demo" controls playsinline preload="metadata" poster="poster.png" src="demo-v4.mp4"></video>
  <div class="meta"><span><b>Video demo v4</b></span><span>2:20</span><span>Stellar testnet</span><span class="tag">Stellar Odyssey Perú</span></div>
  <p>Cobra afuera. Declara tranquilo. Versión comprimida a 720p para verla en el celular; el máster en 1080p está en el proyecto.</p>
  <p><a href="https://honorarios-pe.vercel.app" target="_blank" rel="noopener">honorarios-pe.vercel.app</a></p>
</main>
